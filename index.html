<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./css/design.css">
<title>ウェディング謎</title>

</head>
<body>

<div class="container">

    <h1>ウェディング謎</h1>

    <button class="accordion">
        <span>謎Aのヒント</span>
        <span class="icon">▼</span>
    </button>
    <div class="panel">
        <div class="panel-content">
            謎Aのヒントを記載
            <!-- ▼▼ 子アコーディオン ▼▼ -->
            <button class="accordion child">
                <span>さらに詳しいヒント</span>
                <span class="icon">▼</span>
            </button>
            <div class="panel">
                <div class="panel-content">
                    ここにさらに詳しいヒントを記載できます
                </div>
            </div>
            <!-- ▲▲ 子アコーディオン ▲▲ -->
        </div>
    </div>

    <button class="accordion">
        <span>謎Bのヒント</span>
        <span class="icon">▼</span>
    </button>
    <div class="panel">
        <div class="panel-content">
            謎Bのヒントを記載
        </div>
    </div>

    <button class="accordion">
        <span>謎Cのヒント</span>
        <span class="icon">▼</span>
    </button>
    <div class="panel">
        <div class="panel-content">
            問題Cのヒントを記載
        </div>
    </div>

    <button class="accordion">
        <span>まとめ謎のヒント</span>
        <span class="icon">▼</span>
    </button>
    <div class="panel">
        <div class="panel-content">
            まとめ謎のヒントを記載
        </div>
    </div>

</div>
<script>
const accordions = document.querySelectorAll(".accordion");

accordions.forEach(button => {
    button.addEventListener("click", () => {

        const panel = button.nextElementSibling;
        const icon = button.querySelector(".icon");

        // 開閉処理
        if (panel.style.maxHeight) {
            panel.style.maxHeight = null;
            icon.textContent = "▼";
        } else {
            panel.style.maxHeight = panel.scrollHeight + "px";
            icon.textContent = "▲";
        }

        // ★★★ 入れ子対応：親パネルの高さを再計算する ★★★
        let parent = panel.parentElement;
        while (parent && parent.classList.contains("panel-content")) {
            const parentPanel = parent.parentElement;
            if (parentPanel.classList.contains("panel")) {
                parentPanel.style.maxHeight = parentPanel.scrollHeight + "px";
            }
            parent = parentPanel.parentElement;
        }
    });
});
</script>
</body>
</html>
