<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./css/design.css">
<title>ウェディング謎</title>

</head>
<body>

<div class="container">

    <h1>ウェディング謎</h1>

    <button class="accordion">
        <span>謎Aのヒント</span>
        <span class="icon">▼</span>
    </button>
    <div class="panel">
        <div class="panel-content">
            謎Aのヒントを記載
            <!-- ▼▼ 子アコーディオン ▼▼ -->
            <button class="accordion child">
                <span>さらに詳しいヒント1</span>
                <span class="icon">▼</span>
            </button>
            <div class="panel">
                <div class="panel-content">
                    ここにさらに詳しいヒントを記載できます
                    <!-- ▼▼ 子アコーディオン ▼▼ -->
                    <button class="accordion child grandchild">
                        <span>さらに詳しいヒント2</span>
                        <span class="icon">▼</span>
                    </button>
                    <div class="panel">
                        <div class="panel-content">
                            ここにさらに詳しいヒントを記載できます
                        </div>
                    </div>
                    <!-- ▲▲ 子アコーディオン ▲▲ -->
                </div>
            </div>
            <!-- ▲▲ 子アコーディオン ▲▲ -->
        </div>
    </div>

    <button class="accordion">
        <span>謎Bのヒント</span>
        <span class="icon">▼</span>
    </button>
    <div class="panel">
        <div class="panel-content">
            謎Bのヒントを記載
        </div>
    </div>

    <button class="accordion">
        <span>謎Cのヒント</span>
        <span class="icon">▼</span>
    </button>
    <div class="panel">
        <div class="panel-content">
            問題Cのヒントを記載
        </div>
    </div>

    <button class="accordion">
        <span>まとめ謎のヒント</span>
        <span class="icon">▼</span>
    </button>
    <div class="panel">
        <div class="panel-content">
            まとめ謎のヒントを記載
        </div>
    </div>

</div>
<script>
const accordions = document.querySelectorAll(".accordion");

accordions.forEach(button => {
    button.addEventListener("click", () => {

        const panel = button.nextElementSibling;
        const icon = button.querySelector(".icon");

        const isChild = button.classList.contains("child") || button.classList.contains("grandchild");
        const isOpen = panel.style.height && panel.style.height !== "0px";

        // ★ 子アコーディオンは閉じない
        if (isChild && isOpen) {
            return; // 閉じる処理を完全に無効化
        }

        if (isOpen) {
            // 親アコーディオンの閉じる処理
            panel.style.height = "0px";
            icon.textContent = "▼";
            button.classList.remove("open");

            panel.addEventListener("transitionend", () => {
                adjustParentHeight(panel);
            }, { once: true });

        } else {
            // 開く処理（親も子も共通）
            panel.style.height = panel.scrollHeight + "px";
            icon.textContent = "▲";
            button.classList.add("open");

            adjustParentHeight(panel);
        }
    });
});

// ★★★ 親パネルの高さを正しく再計算する関数 ★★★
function adjustParentHeight(panel) {
    let parent = panel.parentElement;

    while (parent) {
        if (parent.classList.contains("panel")) {
            parent.style.height = parent.scrollHeight + "px";
        }
        parent = parent.parentElement;
    }
}
</body>
</html>
